[package]
name = "audio-tetris"
version = "1.0.5"
edition = "2024"
rust-version = "1.85"

[dependencies]
wxdragon = { git = "https://github.com/allendang/wxDragon" }
rodio = "0.19.0"
rand = "0.8.5"
lazy_static = "1.4.0"
tolk = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
lofty = "0.24.0"
rusqlite = { version = "0.33", features = ["bundled"] }
rust-i18n = "3.1"
sys-locale = "0.3.2"

[package.metadata.i18n]
default-locale = "en-US"
locales = ["en-US", "en-GB"]

[build-dependencies]
winres = "0.1.12"

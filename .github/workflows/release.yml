name: Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Stage release bundle
        shell: powershell
        run: |
          $StagingDir = "audio-tetris-windows-x64"
          New-Item -ItemType Directory -Force -Path $StagingDir
          Copy-Item "target/release/accessible_tetris.exe" -Destination "$StagingDir/accessible_tetris.exe"
          Copy-Item -Recurse "assets" -Destination "$StagingDir/assets"
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination "$StagingDir/README.md" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination "$StagingDir/LICENSE" }
          if (Test-Path "settings.json") { Copy-Item "settings.json" -Destination "$StagingDir/settings.json" }
          Compress-Archive -Path "$StagingDir/*" -DestinationPath "audio-tetris-windows-x64.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: audio-tetris-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
